substitutions:
  name: pool-pump-house
  id_prefix: pool_pump_house
  friendly_name: "Pool Pump House"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  web_server: !include common/web_server.yaml
  device_base: !include common/device_base.yaml
  #esp8266vcc_adc: !include common/esp8266vcc_adc.yaml #can't use this because it uses the VCC pin which is needed for the water filter pressure sensor

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: INFO
    dallas.temp.sensor: INFO

one_wire:
  - platform: gpio
    pin: D2

sensor:
  - platform: dallas_temp
    address: 0x4a082580a9637128
    resolution: 11  # 0.125°C precision
    name: "Water Temperature"
    id: ${id_prefix}_water_temperature
    unit_of_measurement: "°C" # keep all internal values in °C, convert to °F in Home Assistant if needed
    icon: mdi:pool-thermometer
    update_interval: 1s
    filters:
      - median:
          window_size: 10
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.2
          send_every: 15
      - lambda: |-
          if (id(${id_prefix}_water_filter_pressure).state > 6.0) {
            return x;
          }
          return {};
  - platform: dallas_temp
    address: 0x3c000000b3393828
    resolution: 11  # 0.125°C precision
    name: "Air Temperature"
    id: ${id_prefix}_air_temperature
    unit_of_measurement: "°C" # keep all internal values in °C, convert to °F in Home Assistant if needed
    update_interval: 1s
    filters:
      - median:
          window_size: 10
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.2
          send_every: 15

  # Water Filter Pressure Sensor (using ADC)
  - platform: adc
    pin: A0
    #attenuation: 11db # only on esp32
    name: "Water Filter Pressure Raw Voltage"
    id: ${id_prefix}_water_filter_pressure_raw_voltage
    unit_of_measurement: "V"
    icon: "mdi:current-dc"
    accuracy_decimals: 3
    samples: 5
    update_interval: 500ms
    filters:
      - multiply: 3.3 # scale to actual voltage at pin since d1 mini has a voltage divider on the ADC pin
      - median:
          window_size: 10
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.2
          send_every: 15
      - delta: 0.25%

  - platform: template
    name: "Water Filter Pressure"
    id: ${id_prefix}_water_filter_pressure
    unit_of_measurement: "psi"
    icon: "mdi:gauge"
    accuracy_decimals: 1
    update_interval: 500ms
    lambda: |-
      return id(${id_prefix}_water_filter_pressure_raw_voltage).state;
    # https://docs.google.com/spreadsheets/d/1oPyy6xiM6HDB5ek-y8KKNhnjfx7NZcLlSu-kK-Rz0oE/edit?usp=sharing
    filters:
      - multiply: 13.86
      - offset: 1.87
      - clamp:
          min_value: 0.0
      - delta: 0.25%
      - heartbeat:
          period: 60s
          optimistic: true

  # Pump RPM Sensor (estimated from water filter pressure)      
  - platform: template
    name: "Pump RPM (Estimated)"
    id: ${id_prefix}_pump_rpm_estimated
    unit_of_measurement: "RPM"
    device_class: "" # angular speed is not yet a home assistant device class
    state_class: measurement
    icon: "mdi:gauge"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float val = id(${id_prefix}_water_filter_pressure).state;
      if (val <= 0.0) return NAN; // // Avoid math errors for zero or negative numbers
      return -2769.0 + 1918.0 * logf(val);

  # Pump Flow Rate Sensor (estimated from water filter pressure)
  - platform: template
    name: "Pump Flow Rate (Estimated)"
    id: ${id_prefix}_pump_flow_rate_estimated
    unit_of_measurement: "gal/min"
    icon: mdi:waves-arrow-left
    device_class: volume_flow_rate
    state_class: measurement
    icon: "mdi:gauge"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float val = id(${id_prefix}_water_filter_pressure).state;
      if (val <= 0.0) return NAN; // // Avoid math errors for zero or negative numbers
      return -65.0 + 42.9 * logf(val);
  
  # Pump Power Sensor (estimated from water filter pressure)
  - platform: template
    name: "Pump Power (Estimated)"
    id: ${id_prefix}_pump_power_estimated
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: "mdi:lightning-bolt-circle"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float val = id(${id_prefix}_water_filter_pressure).state;
      return -88.5 + 5.74* val + 2.34 * val * val;

  # Total Daily Energy Sensor
  - platform: total_daily_energy
    name: "Total Daily Energy"
    id: ${id_prefix}_total_daily_energy
    power_id: ${id_prefix}_pump_power_estimated
    unit_of_measurement: 'kWh'
    icon: "mdi:lightning-bolt-circle"
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001

# Enable time component to reset energy at midnight
time:
  - platform: homeassistant
    id: homeassistant_time
    