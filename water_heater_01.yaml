substitutions:
  name: water-heater-01
  id_prefix: water_heater_01
  friendly_name: "Water Heater 01"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

packages:
  wifi: !include common/wifi.yaml
  web_server: !include common/web_server.yaml
  device_base: !include common/device_base.yaml
  esp8266vcc_adc: !include common/esp8266vcc_adc.yaml

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: INFO
    dallas.temp.sensor: INFO

one_wire:
  - platform: gpio
    pin: D2

sensor:
  - platform: dallas_temp
    address: 0xb1082580b6b6bc28
    resolution: 11  # 0.125°C precision
    name: "Water Temperature"
    id: ${id_prefix}_temperature
    unit_of_measurement: "°F"
    update_interval: 1s
    filters:
      - lambda: return x * (9.0/5.0) + 32.0;  # Convert to °F
      - median:
          window_size: 10
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.2
          send_every: 15